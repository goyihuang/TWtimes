<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14130f">
<title>圓山・劍潭　臺灣神社與明治橋的四個時代｜今昔街影</title>
<meta name="description" content="臺灣八景之一的圓山：臺灣神社、兩代明治橋、臺灣大飯店到宮殿式圓山大飯店，以 three.js 立體重建，可切換時代、時刻與天氣並拍照。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
</head>
<body class="panel-open">
<canvas id="scene" aria-label="圓山劍潭立體場景：拖曳旋轉、右鍵平移、滾輪縮放"></canvas>
<div id="tags" aria-hidden="true"></div>

<div id="loader"><div class="ld">
  <div class="ld-seal">圓</div>
  <h1>圓山・劍潭</h1><p class="ld-sub">臺灣八景　｜　1901 — 今</p>
  <div class="ld-track"><i id="loadBar"></i></div><p id="loadMsg">準備中…</p>
</div></div>

<header class="ui top">
  <a class="back" href="./" title="回到今昔街影">← 今昔街影</a>
  <div class="ttl"><span class="kicker">TAIWAN EIGHT VIEWS · MARUYAMA &amp; KEELUNG RIVER</span><h1>圓山・劍潭</h1></div>
</header>

<article id="eraCard" class="ui card">
  <div class="card-meta"><span id="eraRange"></span><span id="eraLook" class="look"></span></div>
  <h2 id="eraTitle"></h2><p id="eraText"></p>
</article>

<nav class="ui dock" aria-label="時代">
  <div class="tl-line"></div><div id="timeline"></div>
</nav>

<aside class="ui panel" aria-label="場景設定">
  <button id="panelToggle" class="pt" aria-label="展開或收合設定">⚙</button>
  <div class="pbody">
    <section><h3>時刻</h3><input id="hour" type="range" min="0" max="23.99" step="0.05" value="16.8" aria-label="時刻"><output id="hourVal"></output></section>
    <section><h3>天氣</h3><div id="weather" class="seg"></div></section>
    <section><h3>鏡位</h3><div id="shots" class="grid"></div></section>
    <section><h3>呈現</h3><div class="grid">
      <button id="mood" aria-pressed="true" title="切換時代時套用該時代的時刻與天氣">時代氛圍</button>
      <button id="paint" aria-pressed="false" title="膠彩／水彩筆觸（G）">膠彩筆觸</button>
      <button id="ghost" aria-pressed="true" title="今日時期顯示已拆除的中山橋位置">舊橋殘影</button>
      <button id="labels" aria-pressed="true">地名標註</button>
      <button id="tour" aria-pressed="false">緩緩環繞</button>
      <button id="hide" title="隱藏介面（H）">純畫面</button>
    </div></section>
    <button id="photo" class="shutter">◉ 拍攝此景（P）</button>
  </div>
</aside>
<p id="hint" class="ui hint">拖曳旋轉・右鍵平移・滾輪縮放　｜　1–4 或 ←→ 切換時代</p>
<footer class="ui foot">依舊照、繪葉書、鄉原古統與吉田初三郎畫作、航照重建之示意場景，非精確史實。</footer>
<script type="module" src="./src/yuanshan/main.js"></script>
</body>
</html>
