name: 部署到 GitHub Pages

# 網站先上線：這裡只「取用」已下載好的 OSM 街區（Actions 快取），不在部署時下載，幾分鐘內就能看到改動。
# 街區下載在另一個工作流程 bake-osm.yml 背景進行，補到新的街區後會再觸發這裡重新部署。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 取用最新一份已下載的街區；沒有也沒關係，網頁會改用瀏覽器即時查詢
      - uses: actions/cache/restore@v4
        with:
          path: public/data/osm
          key: osm-bake-latest
          restore-keys: osm-bake-
      - run: mkdir -p public/data/osm && echo "預先下載的街區：$(ls public/data/osm | wc -l) 處，$(du -sh public/data/osm | cut -f1)"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
