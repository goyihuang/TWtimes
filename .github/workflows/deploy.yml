name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bake_minutes:
        description: '這次最多花幾分鐘預先下載 OSM 街區（101 處第一次全部下載約需 60–80 分鐘）'
        default: '20'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 全臺 101 處＋候選地景的現代街景先下載好 OSM 街區，網頁開啟較快。
      # 已下載的存在 Actions 快取，每次只補缺的與超過 30 天的；跑不完留到下次部署。
      # 失敗不擋部署（網頁會改用瀏覽器即時查詢）。
      - uses: actions/cache/restore@v4
        with:
          path: public/data/osm
          key: osm-bake-${{ github.run_id }}
          restore-keys: osm-bake-
      - run: |
          MIN="${BAKE_MIN//[^0-9]/}"
          npm run bake-osm -- --budget=$(( ${MIN:-20} * 60 ))
        env:
          BAKE_MIN: ${{ github.event.inputs.bake_minutes || '20' }}
        continue-on-error: true
        timeout-minutes: 90
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: public/data/osm
          key: osm-bake-${{ github.run_id }}
      - run: du -sh public/data/osm && ls public/data/osm | wc -l
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
