<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>臺南驛前｜今昔街影</title><style> *{box-sizing:border-box}body{margin:0;background:#243b35;color:#fff;font:16px system-ui}canvas{display:block;width:100vw;height:100dvh}header,aside,nav,footer{position:fixed;background:#20342dec;padding:14px;border-radius:9px}header{top:12px;left:12px;max-width:65%}header h1{margin:7px 0;font-size:26px}a{color:#ead7aa}aside{right:12px;top:12px;width:240px}button,select,input{font:inherit}button,select{padding:8px;margin:3px;border:1px solid #789185;border-radius:5px;background:#e5e4d8;color:#20342d;cursor:pointer}button[aria-pressed=true]{background:#d1ab68}label{display:block;margin:8px 0}input{width:100%}nav{bottom:45px;left:12px;right:12px;text-align:center}footer{bottom:5px;left:12px;font-size:12px;padding:6px}p{margin:5px 0;line-height:1.5}#status{color:#f0d59d}@media(max-width:650px){header{max-width:95%;padding:8px}header h1{font-size:18px}aside{top:135px;width:160px;font-size:12px;padding:8px}nav{bottom:50px;padding:4px}button{font-size:12px;padding:5px}footer{max-width:95%}}header,aside,nav{background:rgba(23,34,29,.89);border:1px solid rgba(235,218,177,.26);box-shadow:0 8px 30px #0003;backdrop-filter:blur(14px)}header{max-width:440px;padding:22px}header h1{font-family:serif;font-size:30px;letter-spacing:.06em}header a{font-size:12px;text-decoration:none;letter-spacing:.15em}#story{font-size:14px;color:#e5ddcb}#status{font-size:11px}aside{padding:20px}aside label{font-size:12px;letter-spacing:.12em}aside select{display:block;width:100%;margin:8px 0;background:#33483e;color:#f4ead3}nav{left:50%;right:auto;transform:translateX(-50%);width:min(1000px,96vw);display:flex;gap:5px;padding:10px}nav button{flex:1;background:transparent;color:#e9e1ce;border-color:transparent;border-radius:2px;min-height:50px}nav button[aria-pressed=true]{color:#1d3028;background:#dfc393}button:hover{filter:brightness(1.12)}#photo{background:#dfc393}footer{background:#16251ecc;color:#e0dac8}#clean{position:fixed;right:12px;bottom:12px;z-index:4;background:#243b35;color:white}body.clean header,body.clean aside,body.clean nav,body.clean footer{display:none}@media(max-width:650px){header{max-width:calc(100% - 24px);padding:12px}header h1{font-size:20px}aside{top:190px;width:152px;padding:8px}nav{overflow:auto}nav button{min-width:85px}footer{font-size:10px;max-width:75%}}</style></head><body><canvas id="scene"></canvas><header><a href="./">← 今昔街影</a><h1>臺南驛前・百年府城門戶</h1><p id="story"></p><p id="status" role="status">載入場景…</p></header><aside><label>時刻 <output id="clock">15:00</output><input id="hour" type="range" min="0" max="23.75" step=".25" value="15"></label><label>天氣<select id="weather"><option value="clear">晴天</option><option value="cloudy">多雲</option><option value="rain">雨天</option><option value="fog">霧天</option></select></label><label>鏡位<select id="shot"><option value="0">站前正面</option><option value="1">斜側街景</option><option value="2">鳥瞰</option><option value="3">鐵路側</option><option value="4">門廊斜側</option><option value="5">第一月臺位置</option></select></label><button id="photo">拍照下載</button><button id="share">複製場景網址</button><p>拖曳環繞・右鍵平移・滾輪縮放</p></aside><nav id="eras" aria-label="年代切換"></nav><footer>初版程序化重建示意，非精確史實。地理資料：© OpenStreetMap contributors（如載入成功）。</footer><button id="clean" aria-label="切換純畫面" onclick="document.body.classList.toggle('clean');this.textContent=document.body.classList.contains('clean')?'顯示工具':'純畫面'">純畫面</button><script type="module" src="./src/tainan/main.js"></script></body></html>
