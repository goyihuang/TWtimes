<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>臺南驛前｜今昔街影</title><style> *{box-sizing:border-box}body{margin:0;background:#243b35;color:#fff;font:16px system-ui}canvas{display:block;width:100vw;height:100dvh}header,aside,nav,footer{position:fixed;background:#20342dec;padding:14px;border-radius:9px}header{top:12px;left:12px;max-width:65%}header h1{margin:7px 0;font-size:26px}a{color:#ead7aa}aside{right:12px;top:12px;width:240px}button,select,input{font:inherit}button,select{padding:8px;margin:3px;border:1px solid #789185;border-radius:5px;background:#e5e4d8;color:#20342d;cursor:pointer}button[aria-pressed=true]{background:#d1ab68}label{display:block;margin:8px 0}input{width:100%}nav{bottom:45px;left:12px;right:12px;text-align:center}footer{bottom:5px;left:12px;font-size:12px;padding:6px}p{margin:5px 0;line-height:1.5}#status{color:#f0d59d}@media(max-width:650px){header{max-width:95%;padding:8px}header h1{font-size:18px}aside{top:135px;width:160px;font-size:12px;padding:8px}nav{bottom:50px;padding:4px}button{font-size:12px;padding:5px}footer{max-width:95%}}</style></head><body><canvas id="scene"></canvas><header><a href="./">← 今昔街影</a><h1>臺南驛前・百年府城門戶</h1><p id="story"></p><p id="status" role="status">載入場景…</p></header><aside><label>時刻 <output id="clock">15:00</output><input id="hour" type="range" min="0" max="23.75" step=".25" value="15"></label><label>天氣<select id="weather"><option value="clear">晴天</option><option value="cloudy">多雲</option><option value="rain">雨天</option><option value="fog">霧天</option></select></label><label>鏡位<select id="shot"><option value="0">站前正面</option><option value="1">斜側街景</option><option value="2">鳥瞰</option><option value="3">鐵路側</option></select></label><button id="photo">拍照下載</button><button id="share">複製場景網址</button><p>拖曳環繞・右鍵平移・滾輪縮放</p></aside><nav id="eras" aria-label="年代切換"></nav><footer>初版程序化重建示意，非精確史實。地理資料：© OpenStreetMap contributors（如載入成功）。</footer><script type="module" src="./src/tainan/main.js"></script></body></html>
